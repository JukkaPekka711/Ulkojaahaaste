<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10366b"><title>Ulkojäähaaste</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#142b48;font:16px system-ui}main{max-width:760px;margin:auto;padding:16px}header,section{padding:20px;border-radius:18px;margin-bottom:14px;background:white}header{background:#10366b;color:white}h1,h2{margin:0 0 12px}h1{font-size:27px}h2{font-size:20px}button,input,textarea,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #b8c6d6;margin:5px 0;max-width:100%}button{background:#164d91;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{width:100%}button.secondary{background:#e5edf6;color:#10366b}button.danger{background:#a52c35}progress{width:100%;height:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 4px;border-bottom:1px solid #e5edf6}small{color:#52647a}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.line>*{flex:1}.big{font-size:36px;font-weight:800}#msg{white-space:pre-wrap;color:#a52c35} [hidden]{display:none!important}.activity-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin:16px 0}.activity-person{color:#a1aab5;display:block;width:100%;max-width:30px;margin:auto}.activity-person.done{color:#25834b}.activity-person svg{display:block;width:100%;height:auto}.activity-note{color:#52647a;font-size:14px}</style><main><header><small style="color:#dbeaff">K-ESPOO U12 • 2026–2027</small><h1>🏒 Ulkojäähaaste</h1>Jokainen käynti lasketaan!</header><p id="msg" role="status"></p><section id="login"><h2>Pelaajan kirjautuminen</h2><form id="pf"><input id="code" placeholder="Henkilökohtainen koodi" required autocomplete="off"><button>Kirjaudu</button></form><details><summary>Valmentajan kirjautuminen</summary><form id="cf"><input id="email" type="email" placeholder="Sähköposti" required><input id="password" type="password" placeholder="Salasana" required><button>Kirjaudu valmentajana</button></form></details></section><div id="player" hidden></div><div id="coach" hidden></div><button id="logout" class="secondary" hidden>Kirjaudu ulos</button></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://elkvuhmttpshpntwrklg.supabase.co','sb_publishable_hxB1qGeGNwOvrSA26Z1lhA_Xm3_vAn2');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=localStorage.getItem('ice_token'),mode='',busy=false;
const check=r=>{if(r.error)throw Error(r.error.message);return r.data},rpc=async(n,p)=>check(await db.rpc(n,p));const date=(offset=0)=>{let d=new Date();let parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);let get=t=>parts.find(x=>x.type===t).value;d=new Date(Date.UTC(+get('year'),+get('month')-1,+get('day')+offset));return d.toISOString().slice(0,10)};const fmt=d=>d.split('-').reverse().join('.');
async function run(fn){if(busy)return;busy=true;$('msg').textContent='';try{await fn()}catch(e){$('msg').textContent=e.message==='Invalid session'?'Kirjautuminen vanhentui. Kirjaudu uudelleen.':e.message}finally{busy=false}}
function show(m){mode=m;for(const x of ['login','player','coach'])$(x).hidden=x!==m;$('logout').hidden=m==='login'}
$('pf').onsubmit=e=>{e.preventDefault();run(async()=>{let r=await rpc('player_login',{p_code:$('code').value.trim()});token=r.token;localStorage.setItem('ice_token',token);$('code').value='';await player()})};$('cf').onsubmit=e=>{e.preventDefault();run(async()=>{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';if(!await rpc('is_coach',{})){await db.auth.signOut();throw Error('Ei valmentajan oikeuksia')}await coach()})};
$('logout').onclick=()=>run(async()=>{token=null;localStorage.removeItem('ice_token');await db.auth.signOut();show('login')});
async function player(){let d=await rpc('get_dashboard',{p_token:token}),me=d.players.find(p=>p.id===d.player_id);show('player');$('player').innerHTML=`<section><h2>Hei, ${esc(me?.name)}</h2><div class="big">${me?.total??0} käyntiä</div>Tällä viikolla ${me?.weekly??0}<hr><label>Käyntipäivä<select id="day"><option value="${date()}">Tänään</option><option value="${date(-1)}">Eilen</option></select></label><button id="add">+ Kävin ulkojäällä!</button></section><section><h2>Joukkueen tavoite</h2><div class="big">${d.total} / ${d.target}</div><progress value="${d.total}" max="${d.target}"></progress></section><section><h2>Tämän viikon aktiivisuus</h2><div class="big">${d.players.filter(p=>Number(p.weekly)>0).length} / 50</div><div>pelaajaa käynyt ulkojäällä</div><div class="activity-grid" aria-hidden="true">${Array.from({length:Math.max(50,d.players.filter(p=>Number(p.weekly)>0).length)},(_,i)=>`<span class="activity-person ${i<d.players.filter(p=>Number(p.weekly)>0).length?'done':''}"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/></svg></span>`).join('')}</div><p><b>${Math.round(d.players.filter(p=>Number(p.weekly)>0).length/50*100)} %</b> joukkueesta osallistunut</p><hr><b>${d.players.reduce((sum,p)=>sum+Number(p.weekly),0)} käyntiä tällä viikolla</b><p class="activity-note">Jokainen pelaaja voi auttaa joukkuetta. Viikko vaihtuu maanantaina.</p></section><section><h2>Joukkueen käynnit</h2><select id="sort"><option value="weekly">Tällä viikolla</option><option value="total">Koko talvi</option></select><table><thead><tr><th>Pelaaja</th><th>Käynnit</th></tr></thead><tbody id="rank"></tbody></table></section><section><h2>Viimeisimmät käynnit</h2>${d.recent.map(v=>`<p>${esc(v.name)} · ${fmt(v.visit_date)}</p>`).join('')||'Ei vielä käyntejä'}</section><button id="refresh" class="secondary">Päivitä tilastot</button>`;let rank=()=>{$('rank').innerHTML=[...d.players].sort((a,b)=>b[$('sort').value]-a[$('sort').value]||a.name.localeCompare(b.name,'fi')).map(p=>`<tr><td>${esc(p.name)}</td><td>${p[$('sort').value]}</td></tr>`).join('')};rank();$('sort').onchange=rank;$('refresh').onclick=()=>run(player);$('add').onclick=()=>run(async()=>{if(!confirm('Kirjataanko yksi ulkojääkäynti?'))return;$('add').disabled=true;try{await rpc('add_visit',{p_token:token,p_date:$('day').value});await player();$('msg').textContent='Käynti kirjattu!'}finally{if($('add'))$('add').disabled=false}})}
async function coach(){let [ps,vs,settings]=await Promise.all([db.from('players').select('id,name,active').order('name'),db.from('visits').select('id,player_id,visit_date').order('visit_date',{ascending:false}).limit(100),db.from('challenge_settings').select('target_visits').eq('id',1).single()]);let p=check(ps),v=check(vs),s=check(settings);show('coach');$('coach').innerHTML=`<section><h2>Valmentajan hallinta</h2><label>Joukkueen tavoite<input id="target" type="number" min="1" value="${s.target_visits}"></label><button id="saveTarget">Tallenna tavoite</button></section><section><h2>Lisää pelaajat</h2><textarea id="names" rows="5" placeholder="Yksi nimi per rivi"></textarea><button id="addPlayers">Lisää pelaajat</button></section><section><h2>Pelaajat (${p.filter(x=>x.active).length})</h2><p><small>Uusi koodi mitätöi vanhan koodin ja kirjautumiset. Jaa koodi vain kyseiselle pelaajalle.</small></p>${p.map(x=>`<p><b>${esc(x.name)}</b> ${x.active?'':'(pois käytöstä)'}<br><button data-code="${x.id}">Luo koodi</button> <button class="secondary" data-active="${x.id}" data-value="${!x.active}">${x.active?'Poista käytöstä':'Aktivoi'}</button></p>`).join('')}</section><section><h2>Viimeisimmät 100 merkintää</h2>${v.map(x=>`<p>${esc(p.find(y=>y.id===x.player_id)?.name)} · ${fmt(x.visit_date)} <button class="danger" data-delete="${x.id}">Poista</button></p>`).join('')||'Ei käyntejä'}</section>`;$('saveTarget').onclick=()=>run(async()=>{let n=Number($('target').value);if(!Number.isInteger(n)||n<1)throw Error('Anna positiivinen kokonaisluku');check(await db.from('challenge_settings').update({target_visits:n}).eq('id',1));await coach()});$('addPlayers').onclick=()=>run(async()=>{let names=[...new Set($('names').value.split('\n').map(x=>x.trim()).filter(Boolean))].filter(n=>!p.some(x=>x.name===n));if(!names.length)return;check(await db.from('players').insert(names.map(name=>({name}))));await coach()});document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>run(async()=>{if(!confirm('Luodaanko uusi henkilökohtainen koodi?'))return;let c=await rpc('create_player_code',{p_player_id:b.dataset.code});let field=document.createElement('input');field.readOnly=true;field.value=c;b.parentElement.append(field);field.select()}));document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>run(async()=>{check(await db.from('players').update({active:b.dataset.value==='true'}).eq('id',b.dataset.active));await coach()}));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>run(async()=>{if(confirm('Poistetaanko käynti pysyvästi?')){check(await db.from('visits').delete().eq('id',b.dataset.delete));await coach()}}))}
run(async()=>{let s=check(await db.auth.getSession());if(s.session&&await rpc('is_coach',{}))await coach();else if(token){try{await player()}catch(e){show('login');throw e}}else show('login')});
</script></html>
